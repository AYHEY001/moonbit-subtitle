name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 工具链版本
        run: moon version --all

      - name: 解析依赖
        run: moon install

      # 警告视为错误。这个项目的目标是零警告，
      # 与其等它慢慢积累，不如让 CI 直接把第一处拦下来。
      - name: 类型检查
        run: moon check --deny-warn

      - name: 格式检查
        run: moon fmt --check

      - name: 测试
        run: moon test --deny-warn
